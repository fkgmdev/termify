[package]
name = "termify"
version = "0.1.0"
edition = "2024"
description = "A terminal Spotify client with local librespot playback, search, playlists and lyrics"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }
librespot-core = "0.8"
librespot-playback = "0.8"
mpris-server = { version = "0.11", features = ["tokio"] }
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rand = "0.8"
crossterm = { version = "0.29", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json"] }
rspotify = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webbrowser = "1"
