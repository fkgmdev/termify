[package]
name = "termify"
version = "0.1.0"
edition = "2024"
description = "A terminal Spotify client with local librespot playback, offline downloads, search, playlists and lyrics"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }
librespot-audio = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-playback = "0.8"
mpris-server = { version = "0.11", features = ["tokio"] }
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis", "mp3"] }
rand = "0.8"
crossterm = { version = "0.29", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json"] }
rspotify = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webbrowser = "1"

# Native OS media controls. Linux keeps using MPRIS through mpris-server;
# macOS and Windows use the platform backends in souvlaki. Windows needs the
# windows crate as well because SMTC requires a window handle, and termify is a
# terminal app with no window of its own.
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = { version = "0.9.3", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.9.3", default-features = false }
